name: Build VibrateStrong
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          git clone https://github.com/theos/sdks sdks
          cd sdks
          git sparse-checkout init --cone
          git sparse-checkout set iPhoneOS17.0.sdk
          git pull
      - name: Build Tweak
        env:
          THEOS: $HOME/theos
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
