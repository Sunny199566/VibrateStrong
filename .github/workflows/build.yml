name: Build VibrateStrong
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Theos
      run: |
        brew install ldid dpkg
        export THEOS="${{ github.workspace }}/theos"
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH
        git clone --recursive https://github.com/theos/theos.git $THEOS

    - name: Checkout SDK iPhoneOS16.5.sdk (sparse checkout)
      uses: actions/checkout@v4
      with:
        repository: theos/sdks
        sparse-checkout: iPhoneOS16.5.sdk
        path: theos/sdks

    - name: Compile Tweak (Deb)
      run: |
        make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

    - name: Upload Deb
      uses: actions/upload-artifact@v4
      with:
        name: VibrateStrong-Deb
        path: packages/*.deb