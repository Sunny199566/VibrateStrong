name: Build VibrateStrong
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # 使用官方脚本拉取SDK，代替手动clone，不会冲突
          cd $THEOS
          ./bin/fetch_sdks iPhoneOS17.0.sdk
      
      - name: Build Tweak
        env:
          THEOS: $HOME/theos
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless
      
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb